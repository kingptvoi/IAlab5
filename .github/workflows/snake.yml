name: Generează șarpele

on:
  schedule:
    - cron: "0 0 * * *" # o dată pe zi
  workflow_dispatch: # poate fi pornit și manual
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generează animația
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_dots=#0d1117,#0e4429,#006d32,#26a641,#00ff41

      - name: Publică pe branch-ul „output”
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
