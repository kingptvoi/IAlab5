<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 0 1000 20" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".7"/><stop offset="1" stop-color="#b388ff" stop-opacity="0"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"><animate attributeName="stdDeviation" values="2.5;6;2.5" dur="3s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<line x1="0" y1="10" x2="1000" y2="10" stroke="url(#l)" stroke-width="1.5"/>
<line x1="0" y1="10" x2="1000" y2="10" stroke="#00ff41" stroke-opacity=".25" stroke-dasharray="2 8"/>
<circle r="4" cy="10" fill="#00ff41" filter="url(#glow)"><animate attributeName="cx" values="0;1000" dur="5s" repeatCount="indefinite"/></circle>
<circle r="3" cy="10" fill="#b388ff" filter="url(#glow)"><animate attributeName="cx" values="1000;0" dur="7s" repeatCount="indefinite"/></circle>
</svg>